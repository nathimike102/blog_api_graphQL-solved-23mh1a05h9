services:
  # PostgreSQL Database (Render Managed)
  - type: pserv
    name: blog-db
    plan: free
    region: oregon

  # Redis Instance (Render Managed)
  - type: redis
    name: blog-redis
    plan: free
    region: oregon
    ipAllowList: []

  # GraphQL API Application
  - type: web
    name: blog-api
    env: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: blog-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: blog-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY
        value: 1h
      - key: CORS_ORIGIN
        value: "*"
      - key: LOG_LEVEL
        value: info
